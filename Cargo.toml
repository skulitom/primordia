[package]
name = "primordia"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "A GPU artificial-life laboratory: slime molds, particle life, Lenia and reaction-diffusion rendered as living light."
license = "MIT"
readme = "README.md"
repository = "https://github.com/skulitom/primordia"
homepage = "https://github.com/skulitom/primordia"
keywords = ["artificial-life", "wgpu", "simulation", "generative-art", "physarum"]
categories = ["simulation", "graphics", "visualization"]

[dependencies]
# Rendering / windowing. Versions are pinned to the newest releases that still
# build on Rust 1.86 (egui-wgpu 0.32 requires wgpu 25 + winit 0.30).
wgpu = "25.0.2"
winit = "0.30.13"
egui = "0.32.3"
egui-wgpu = { version = "0.32.3", features = ["winit"] }
egui-winit = "0.32.3"

pollster = "0.4"
bytemuck = { version = "1.23", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# PNG text chunks: provenance and the embedded recipe (the version the image crate already uses).
png = "0.18"
# Captions on contact sheets: egui's glyph rasteriser and its bundled fonts (both already in the lock).
ab_glyph = "0.2.32"
epaint_default_fonts = "0.32.3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "Did you mean" suggestions for world, preset and measurement names (clap already depends on it).
strsim = "0.11"
tempfile = "3"

# Closing the console of a double-clicked exe, and its error message box (src/console.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1

# Dependencies (wgpu, naga, egui, png) are compiled optimised even in dev
# builds so the debug binary still runs at full speed.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
